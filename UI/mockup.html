<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogWatch HDFS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f4f3ef; --surface:#fcfcfb; --surface-2:#f0efec; --surface-3:#e8e7e2;
  --border:#e1e0da; --border-strong:#cfcec7;
  --text:#0b0b0b; --text-2:#52514e; --text-3:#7a7975;
  --grid:#e6e5e0; --axis:#bdbcb5;
  --normal:#2a78d6; --anom:#eb6834;
  --accent:#6250d6; --accent-ink:#4a3aa7; --accent-soft:#ebe8fb;
  --good:#0ca30c; --good-ink:#006300; --crit:#d03b3b; --crit-ink:#b02a2a;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#111110; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2c2c2a;
    --border:#2e2e2b; --border-strong:#3e3e3a;
    --text:#f0efec; --text-2:#c3c2b7; --text-3:#8d8c84;
    --grid:#282826; --axis:#4a4a46;
    --normal:#3987e5; --anom:#d95926;
    --accent:#9085e9; --accent-ink:#b3abf2; --accent-soft:#26233c;
    --good:#0ca30c; --good-ink:#4cc94c; --crit:#e66767; --crit-ink:#f08a8a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111110; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2c2c2a;
  --border:#2e2e2b; --border-strong:#3e3e3a;
  --text:#f0efec; --text-2:#c3c2b7; --text-3:#8d8c84;
  --grid:#282826; --axis:#4a4a46;
  --normal:#3987e5; --anom:#d95926;
  --accent:#9085e9; --accent-ink:#b3abf2; --accent-soft:#26233c;
  --good:#0ca30c; --good-ink:#4cc94c; --crit:#e66767; --crit-ink:#f08a8a;
  --shadow:none;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
button{font-family:inherit}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0 14px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand h1{font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em}
.brand p{margin:0;color:var(--text-2);font-size:12.5px}
.logo{width:36px;height:36px;flex:none;border-radius:9px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center}
.hright{display:flex;gap:10px;align-items:center;flex:none}
.pill{font:500 10.5px/1 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.07em;padding:7px 9px;border:1px dashed var(--border-strong);border-radius:6px;color:var(--text-2);white-space:nowrap}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{color:var(--text)}

nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{appearance:none;background:none;border:0;padding:10px 14px;font:500 13.5px 'IBM Plex Sans',sans-serif;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--text)}
nav.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs .num{font:500 10.5px 'IBM Plex Mono',monospace;color:var(--text-3);margin-right:6px}

.controls{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 0;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.ctl{display:flex;align-items:center;gap:8px}
.ctl > label{font-size:12px;color:var(--text-3)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-weight:500;font-size:12.5px;color:var(--text-2);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.10)}
.thrchip{margin-left:auto;background:var(--accent-soft);border-radius:8px;padding:5px 10px}
.thrchip span{font-weight:600;color:var(--accent-ink)}

main{padding:20px 0 40px}
.view{display:grid;gap:16px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:14.5px;margin:0 0 2px;font-weight:600;letter-spacing:-.005em}
.sub{color:var(--text-2);font-size:12.5px;margin:0 0 14px;max-width:70ch}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.eyebrow{font:500 10.5px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin-bottom:8px}
.grid{display:grid;gap:16px;min-width:0}
.grid > *{min-width:0}
.g2{grid-template-columns:1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
.g75{grid-template-columns:7fr 5fr}
.g57{grid-template-columns:5fr 7fr}
@media (max-width:900px){.g2,.g75,.g57{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.g6{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.g6{grid-template-columns:1fr 1fr}.controls{position:static}.thrchip{margin-left:0}.pill{display:none}}

/* hero */
.lede{font-size:21px;line-height:1.45;letter-spacing:-.01em;margin:0 0 20px;max-width:46ch;font-weight:400}
.lede b{font-weight:600}
.hl{color:var(--accent-ink)}
.stat{border-top:1px solid var(--border);padding-top:12px}
.stat .k{font-size:12px;color:var(--text-2)}
.stat .v{font:600 26px/1.15 'IBM Plex Mono',monospace;letter-spacing:-.03em;margin:4px 0 2px}
.stat .n{font-size:11.5px;color:var(--text-3)}

/* pipeline */
.pipe{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;counter-reset:s}
.pipe li{position:relative;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 12px 13px}
.pipe li:not(:last-child)::after{content:"";position:absolute;right:-8px;top:50%;width:6px;height:6px;border-top:1.5px solid var(--text-3);border-right:1.5px solid var(--text-3);transform:translateY(-50%) rotate(45deg)}
.pipe .s{font:500 10.5px 'IBM Plex Mono',monospace;color:var(--text-3)}
.pipe .t{font-weight:600;font-size:13px;margin:2px 0}
.pipe .d{font:12px 'IBM Plex Mono',monospace;color:var(--text-2)}
.pipe li.last{background:var(--accent-soft);border-color:transparent}
@media (max-width:900px){.pipe{grid-template-columns:1fr}.pipe li:not(:last-child)::after{right:auto;left:22px;top:auto;bottom:-8px;transform:rotate(135deg)}}

/* tables */
.tblwrap{overflow-x:auto;margin:0 -4px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;font-size:11.5px;color:var(--text-3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl td.num,.tbl th.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl tr.muted td{color:var(--text-3)}
.tbl tr.divider td{padding:0;border:0}
.divline{display:flex;align-items:center;gap:8px;padding:6px 8px;font:500 11px 'IBM Plex Mono',monospace;color:var(--accent-ink)}
.divline::before,.divline::after{content:"";flex:1;border-top:1.5px dashed var(--accent)}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--text-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:2px;width:16px;border-radius:2px;vertical-align:3px}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;white-space:nowrap}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.badge.n{--c:var(--normal)}
.badge.a{--c:var(--anom)}
.res{font:500 11.5px 'IBM Plex Mono',monospace;white-space:nowrap}
.res.ok{color:var(--good-ink)}
.res.bad{color:var(--crit-ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.ev{font:500 11px 'IBM Plex Mono',monospace;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;white-space:nowrap}
.pbar{display:flex;align-items:center;gap:8px;min-width:120px}
.pbar .tr{flex:1;height:6px;border-radius:3px;background:var(--surface-3);position:relative;overflow:hidden}
.pbar .fl{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent)}
.pbar .vv{font:500 12px 'IBM Plex Mono',monospace;width:42px;text-align:right}

/* confusion matrix */
.cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px;font-size:12px}
.cm .h{color:var(--text-3);padding:4px 6px;font-size:11.5px;display:flex;align-items:flex-end}
.cm .rh{color:var(--text-3);padding:6px;font-size:11.5px;display:flex;align-items:center;writing-mode:horizontal-tb}
.cm .c{border-radius:8px;padding:12px;background:var(--surface-2);border:1px solid var(--border)}
.cm .c.err{background:transparent;border-style:dashed;border-color:var(--border-strong)}
.cm .c .v{font:600 22px/1.1 'IBM Plex Mono',monospace;letter-spacing:-.02em}
.cm .c .l{color:var(--text-2);margin-top:4px}

/* threshold */
.thr-top{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:end}
.thr-ctl{display:flex;align-items:center;gap:14px;min-width:min(420px,100%)}
.thr-ctl output{font:600 26px 'IBM Plex Mono',monospace;letter-spacing:-.03em;color:var(--accent-ink);min-width:80px;text-align:right}
.quick{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:500;color:var(--text-2);cursor:pointer}
.chip:hover{color:var(--text);border-color:var(--border-strong)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
@media (max-width:700px){.thr-top{grid-template-columns:1fr}}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer;accent-color:var(--accent)}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,50%),var(--surface-3) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--surface-3)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);margin-top:-7px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.kpis{margin-top:16px}
.kpi{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.kpi .k{font-size:11.5px;color:var(--text-2)}
.kpi .v{font:600 20px/1.2 'IBM Plex Mono',monospace;letter-spacing:-.02em;margin-top:2px}
.story{margin:14px 0 0;color:var(--text-2);font-size:13.5px;max-width:80ch}
.story b{color:var(--text);font-weight:600}

/* simulator */
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.sl{padding:7px 0;border-top:1px solid var(--border)}
.sl-h{display:flex;align-items:center;gap:8px;font-size:12.5px}
.sl-h .sl-l{color:var(--text-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-h output{font:600 14px 'IBM Plex Mono',monospace;width:22px;text-align:right}
.sl-h .ty{font:11px 'IBM Plex Mono',monospace;color:var(--text-3)}
.bigprob{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 4px}
.bigprob .v{font:600 52px/1 'IBM Plex Mono',monospace;letter-spacing:-.04em}
.verdict{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;background:var(--surface-2)}
.verdict::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.verdict.a{--c:var(--anom)}
.verdict.n{--c:var(--normal)}
.callout{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:13px;color:var(--text)}
.callout b{color:var(--accent-ink)}
.mrow{display:grid;grid-template-columns:130px 1fr 50px;gap:10px;align-items:center;padding:5px 0;font-size:12.5px}
.mrow .tr{height:8px;border-radius:4px;background:var(--surface-3);position:relative}
.mrow .fl{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.mrow .tk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);border-radius:1px}
.mrow .vv{font:500 12px 'IBM Plex Mono',monospace;text-align:right}
.mrow.sel{font-weight:600}

/* datos */
.prop{display:flex;gap:2px;height:28px;margin:6px 0 10px}
.prop div{border-radius:5px}
.dict td:first-child{font-family:'IBM Plex Mono',monospace;font-weight:600}
.dict .tpl{font:11.5px 'IBM Plex Mono',monospace;color:var(--text-2)}

svg{display:block;overflow:visible}
svg text{font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;fill:var(--text-2)}
svg text.mono{font-family:'IBM Plex Mono',monospace}
svg text.ink{fill:var(--text)}
svg text.muted{fill:var(--text-3)}

#tip{position:fixed;z-index:50;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;line-height:1.45;padding:7px 10px;border-radius:7px;max-width:260px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
#tip b{font-weight:600}
footer{color:var(--text-3);font-size:12px;padding:0 0 32px}
.note{font-size:11.5px;color:var(--text-3);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 20 20"><g stroke="var(--text-3)" stroke-width="2" stroke-linecap="round"><line x1="3" y1="4" x2="13" y2="4"/><line x1="3" y1="8" x2="10" y2="8"/><line x1="3" y1="16" x2="12" y2="16"/></g><line x1="3" y1="12" x2="9" y2="12" stroke="var(--anom)" stroke-width="2" stroke-linecap="round"/><circle cx="15" cy="12" r="2.6" fill="var(--anom)"/></svg>
      </div>
      <div><h1>LogWatch</h1><p>Detección de anomalías en logs de HDFS · Machine Learning, UTEC 2026</p></div>
    </div>
    <div class="hright">
      <span class="pill">Mockup · datos simulados</span>
      <button class="iconbtn" data-act="theme" aria-label="Cambiar tema claro/oscuro" data-tip="Tema claro / oscuro">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="controls" id="controls"></div>
  <main id="main"></main>
  <footer>Mockup de interfaz para el proyecto final. Todos los resultados de modelos son <b>simulados</b> para ilustrar el diseño; solo la pestaña <i>Datos</i> usa cifras reales del Avance 1.</footer>
</div>
<div id="tip" hidden></div>

<script>
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('en-US');
const pct = (x, d = 1) => (x * 100).toFixed(d) + '%';
const f3 = x => x.toFixed(3);
const sig = z => 1 / (1 + Math.exp(-z));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0;while(u===0)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r())}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

/* ---------- datos simulados ---------- */
const N_TEST = 115013, A_TEST = 3368, N_NORM = N_TEST - A_TEST;
const MODELS = [
  {id:'dt', name:'Árbol de decisión',   short:'Árbol',     a:[4.6,2.3], n:[-6.4,2.0], hide:.012, sim:{b:-3.4,k:1.0},  tree:true},
  {id:'rf', name:'Random Forest',       short:'RF',        a:[5.6,2.0], n:[-7.4,1.9], hide:.008, sim:{b:-3.5,k:1.05}, tree:true},
  {id:'lr', name:'Regresión logística', short:'Reg. log.', a:[3.4,2.1], n:[-5.6,1.8], hide:.010, sim:{b:-3.0,k:.85},  tree:false},
  {id:'nb', name:'Naive Bayes',         short:'NB',        a:[3.6,2.6], n:[-5.0,2.0], hide:.006, sim:{b:-2.4,k:.7},   tree:false},
];
const REP = {count:{a:0,n:0,label:'Conteo'}, tfidf:{a:.35,n:-.25,label:'TF-IDF'}};
const BAL = {cw:{a:0,n:0,label:'class_weight'}, smote:{a:.5,n:.35,label:'SMOTE'}};
const NB = 200;
const cache = {};

function getDist(id, rep = S.rep, bal = S.bal){
  const key = id + '|' + rep + '|' + bal;
  if (cache[key]) return cache[key];
  const m = MODELS.find(x => x.id === id), r = mulberry32(hashStr(key));
  const damp = m.tree ? .4 : 1;
  const aMu = m.a[0] + REP[rep].a * damp + BAL[bal].a;
  const nMu = m.n[0] + REP[rep].n * damp + BAL[bal].n;
  const hA = new Float64Array(NB), hN = new Float64Array(NB);
  const bin = s => Math.min(NB - 1, Math.floor(s * NB));
  for (let i = 0; i < A_TEST; i++){
    const hidden = r() < m.hide; // anomalías con conteos idénticos a un bloque normal
    hA[bin(sig(hidden ? nMu + m.n[1] * gauss(r) : aMu + m.a[1] * gauss(r)))]++;
  }
  for (let i = 0; i < N_NORM; i++) hN[bin(sig(nMu + m.n[1] * gauss(r)))]++;
  const cA = new Float64Array(NB + 1), cN = new Float64Array(NB + 1);
  for (let i = NB - 1; i >= 0; i--){ cA[i] = cA[i + 1] + hA[i]; cN[i] = cN[i + 1] + hN[i]; }
  return cache[key] = {hA, hN, cA, cN};
}
function metricsAt(d, t){
  const b = Math.max(0, Math.min(NB, Math.round(t * NB)));
  const TP = d.cA[b], FP = d.cN[b], FN = A_TEST - TP, TN = N_NORM - FP;
  const P = TP + FP ? TP / (TP + FP) : 1, R = TP / A_TEST, F1 = P + R ? 2 * P * R / (P + R) : 0;
  return {TP, FP, FN, TN, P, R, F1, acc:(TP + TN) / N_TEST, flag:TP + FP};
}

/* eventos y simulador */
const EV = ['E5','E9','E11','E26','E22','E3','E7','E13'];
const EV_INFO = {
  E5:{lbl:'Recepción iniciada', typ:3, tpl:'Receiving block * src: * dest: *', desc:'Un DataNode inicia la recepción del bloque; una vez por réplica.'},
  E9:{lbl:'Recepción confirmada', typ:3, tpl:'Received block * of size * from *', desc:'Un DataNode confirma la recepción completa y su tamaño.'},
  E11:{lbl:'PacketResponder termina', typ:3, tpl:'PacketResponder * for block * terminating', desc:'Cierre normal del hilo que confirma paquetes en el pipeline.'},
  E26:{lbl:'Réplica registrada', typ:3, tpl:'BLOCK* NameSystem.addStoredBlock: blockMap updated: * is added to * size *', desc:'El NameNode registra que una réplica quedó almacenada.'},
  E22:{lbl:'Bloque asignado', typ:1, tpl:'BLOCK* NameSystem.allocateBlock: *', desc:'El NameNode asigna un nuevo bloque (inicio del ciclo de vida).'},
  E3:{lbl:'Bloque servido (lectura)', typ:0, tpl:'* Served block * to *', desc:'Un DataNode envía el bloque a un cliente.'},
  E7:{lbl:'Excepción en writeBlock', typ:0, tpl:'writeBlock * received exception *', desc:'Se produce una excepción durante la escritura.'},
  E13:{lbl:'Paquete vacío recibido', typ:0, tpl:'Receiving empty packet for block *', desc:'Un DataNode recibe un paquete vacío para el bloque.'},
};
function contrib(v){
  return {
    E9:1.7*Math.max(0,3-v.E9), E11:1.7*Math.max(0,3-v.E11), E26:1.5*Math.max(0,3-v.E26),
    E5:1.4*Math.abs(v.E5-3), E22:2.2*Math.abs(v.E22-1), E3:.3*v.E3, E7:3.0*v.E7, E13:2.0*v.E13,
  };
}
function simScore(id, v){
  const m = MODELS.find(x => x.id === id);
  const d = Object.values(contrib(v)).reduce((a, b) => a + b, 0);
  const dd = 6 * Math.log1p(d / 6); // comprime desviaciones grandes para que las probabilidades no saturen
  const adj = (S.bal === 'smote' ? .4 : 0) + (S.rep === 'tfidf' && !m.tree ? .2 : 0);
  return sig(m.sim.b + adj + m.sim.k * dd);
}

function histSVG(d, t, W){
  const bins = 50, k = NB / bins, ml = 44, mr = 10, ph = 108, gap = 40, mt = 22, mb = 34;
  const H = mt + ph * 2 + gap + mb, iw = W - ml - mr, bw = iw / bins;
  const agg = h => { const o = []; for (let i = 0; i < bins; i++){ let s = 0; for (let j = 0; j < k; j++) s += h[i * k + j]; o.push(s); } return o; };
  const A = agg(d.hA), N = agg(d.hN);
  const lmin = Math.log10(.6), lmax = Math.log10(Math.max(...N, ...A)) + .15;
  const y = (c, top) => top + ph - (c > 0 ? (Math.log10(c) - lmin) / (lmax - lmin) * ph : 0);
  const tick = p => ['1','10','100','1k','10k','100k','1M'][p];
  const tx = ml + t * iw;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Histograma de probabilidades por clase">`;
  [{name:'Normales', n:N_NORM, data:N, top:mt, c:'var(--normal)', on:'falsas alarmas'},
   {name:'Anomalías', n:A_TEST, data:A, top:mt + ph + gap, c:'var(--anom)', on:'atrapadas'}].forEach(p => {
    s += `<text x="${ml}" y="${p.top - 9}" class="ink" style="font-weight:600">${p.name} <tspan class="mono muted" style="font-weight:400">${fmt(p.n)} bloques</tspan></text>`;
    for (let e = 0; e <= lmax; e += (lmax > 4 ? 2 : 1)){
      const yy = y(10 ** e, p.top);
      s += `<line x1="${ml}" x2="${W - mr}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${ml - 8}" y="${yy + 4}" text-anchor="end" class="mono muted">${tick(e)}</text>`;
    }
    s += `<line x1="${ml}" x2="${W - mr}" y1="${p.top + ph}" y2="${p.top + ph}" stroke="var(--axis)"/>`;
    p.data.forEach((c, i) => {
      const x0 = ml + i * bw, flagged = i / bins >= t - 1e-9;
      if (c > 0){
        const yy = y(c, p.top), h = p.top + ph - yy;
        s += `<rect x="${x0 + 1}" y="${yy}" width="${Math.max(1, bw - 2)}" height="${h}" rx="${Math.min(2, bw / 4)}" fill="${p.c}" opacity="${flagged ? 1 : .32}"/>`;
      }
      s += `<rect x="${x0}" y="${p.top}" width="${bw}" height="${ph}" fill="transparent" data-tip="<b>${p.name}</b> · prob. ${(i / bins).toFixed(2)}–${((i + 1) / bins).toFixed(2)}<br>${fmt(c)} bloques · ${flagged ? (p.name === 'Normales' ? 'marcados (falsas alarmas)' : 'marcados (atrapadas)') : (p.name === 'Normales' ? 'no marcados' : 'no detectadas')}"/>`;
    });
  });
  const bot = mt + ph * 2 + gap;
  [0, .25, .5, .75, 1].forEach(v => s += `<text x="${ml + v * iw}" y="${bot + 16}" text-anchor="middle" class="mono muted">${v}</text>`);
  s += `<text x="${ml + iw / 2}" y="${bot + 31}" text-anchor="middle" class="muted">probabilidad de anomalía según el modelo</text>`;
  s += `<line x1="${tx}" x2="${tx}" y1="${mt - 4}" y2="${bot}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"/>`;
  const right = t < .7;
  s += `<text x="${tx + (right ? 7 : -7)}" y="${mt + ph + 15}" text-anchor="${right ? 'start' : 'end'}" class="mono" style="fill:var(--accent-ink);font-weight:600">umbral ${t.toFixed(3)}${right && W > 480 ? ' → marcados' : ''}</text>`;
  return s + `</svg><div class="note">Eje vertical en escala logarítmica: hay 33 veces más bloques normales que anómalos.</div>`;
}

    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * W / r.width;
    const rec = lo + (mx - ml) / iw * (1 - lo);
    let best = pts[0]; pts.forEach(p => { if (Math.abs(p.R - rec) < Math.abs(best.R - rec)) best = p; });
    if (!best) return;
    const px = ml + (best.R - lo) / (1 - lo) * iw, py = mt + ih - (best.P - lo) / (1 - lo) * ih;
    g.style.display = ''; $('#prhl').setAttribute('x1', px); $('#prhl').setAttribute('x2', px);
    $('#prhc').setAttribute('cx', px); $('#prhc').setAttribute('cy', py);
    tip.innerHTML = `<b>Umbral ${best.t.toFixed(3)}</b><br>Recall ${f3(best.R)} · Precisión ${f3(best.P)}<br><span style="opacity:.75">clic para usar este umbral</span>`;
    tip.hidden = false; placeTip(e);
    hit.dataset.t = best.t;
  });
  hit.addEventListener('pointerleave', () => { g.style.display = 'none'; tip.hidden = true; });
  hit.addEventListener('click', () => { if (hit.dataset.t){ setT(+hit.dataset.t); } });
}
function bestThr(kind){
  const d = getDist(S.model); let bt = .5, bv = -1;
  if (kind === 'f1'){ for (let b = 1; b < NB; b++){ const m = metricsAt(d, b / NB); if (m.F1 > bv){ bv = m.F1; bt = b / NB; } } }
  if (kind === 'r99'){ bt = 1 / NB; for (let b = 1; b < NB; b++){ if (metricsAt(d, b / NB).R >= .99) bt = b / NB; } }
  if (kind === 'p99'){ bt = (NB - 1) / NB; for (let b = NB - 1; b >= 1; b--){ if (metricsAt(d, b / NB).P >= .99) bt = b / NB; } }
  if (kind === 'def') bt = .5;
  return bt;
}

document.addEventListener('click', e => {

  else if (k === 'model'){ S.model = v; render(); }
  else if (k === 'rep'){ S.rep = v; render(); }
  else if (k === 'bal'){ S.bal = v; render(); }
  else if (k === 'variant'){ [S.rep, S.bal] = v.split('-'); render(); }
  else if (k === 'metric'){ S.metric = v; render(); }
  else if (k === 'tri'){ S.tri = v; render(); }
  else if (k === 'block'){ S.sel = v; render(); }
  else if (k === 'thr'){ setT(bestThr(v)); }
  else if (k === 'preset'){ const p = PRESETS.find(x => x.id === v); S.sim = {...p.v}; S.preset = v; render(); }

    document.documentElement.dataset.theme = dark ? 'light' : 'dark';

});
